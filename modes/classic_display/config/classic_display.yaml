#config_version=6

mode:
  start_events: ball_starting{machine.session_game == "classic"}
  stop_events: ball_ended, game_will_end
  stop_on_ball_end: false
  game_mode: false
  priority: 110

slide_player:
  mode_classic_display_started{player == 1 and ball == 1 and not is_extra_ball}:
    classic:
      tokens:
        notice: Classic started
  mode_classic_display_started{player != 1 or ball != 1 or is_extra_ball}:
    classic:
      tokens:
        notice: Classic
