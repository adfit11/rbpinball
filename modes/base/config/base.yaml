#config_version=6

# Entry point for the Modern game's ball-scoped rules and presentation.

mode:
  start_events: ball_starting{machine.session_game == "modern"}
  stop_events: ball_will_end
  priority: 100

event_player:
  mode_base_started:
    - start_mode_outlanes
    - start_mode_bumpers
    - start_mode_right_drops
  mode_base_will_stop:
    - stop_mode_outlanes
    - stop_mode_bumpers
    - stop_mode_right_drops

  return_rollover_left_hit: start_mode_hurryup
  

shots:
  return_rollover_left:
    switches: s_return_left_16

slide_player:
  mode_base_started: base_slide

sound_player:
  mode_base_started:
    base_music:
      bus: music
      fade_out: 500ms
      loops: -1
