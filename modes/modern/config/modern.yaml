#config_version=6

mode:
  code: custom_code.modern.core.ModernCore
  start_events: ball_starting{machine.session_game == "modern"}
  stop_events: ball_will_end
  priority: 100

sound_player:
  modern_bumper_hit:
    bumper_effect:
      bus: effects
  modern_drop_hit:
    right_drops_effect:
      bus: effects
  modern_song_shot:
    jackpot:
      bus: effects
  modern_jackpot:
    jackpot:
      bus: effects
  modern_super_jackpot:
    jackpot:
      bus: effects
  modern_artist_chosen:
    record_crackle:
      bus: effects
      loops: -1
  modern_record_crackle_stop:
    record_crackle:
      action: stop
  ball_will_end:
    record_crackle:
      action: stop

show_player:
  modern_song_shot:
    modern_song_shot:
      loops: 0
      priority: 10
