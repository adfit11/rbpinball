#config_version=6

mode:
  code: custom_code.modern.high_score.ModernHighScore
  start_events: game_ending{machine.session_game == "modern"}
  priority: 1500
  game_mode: false
  use_wait_queue: true

high_score:
  enter_initials_timeout: 60
  award_slide_display_time: 4s
  categories:
    score:
      - KING OF THE JOINT
      - HIGH SCORE 1
      - HIGH SCORE 2
      - HIGH SCORE 3
  defaults:
    score:
      - LJ: 20000000
      - RB: 15000000
      - BJT: 10000000
      - EJ: 5000000

slide_player:
  high_score_enter_initials:
    high_score_entry:
      action: play
      tokens:
        title: SIGN THE GUEST BOOK
  high_score_award_display:
    high_score_award:
      action: play
      tokens:
        title: WELCOME TO THE GUEST BOOK
    high_score_entry:
      action: remove
