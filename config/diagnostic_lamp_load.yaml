#config_version=6

# Lamp load check: L43-L47 flash at 250 ms as in Modern while the crater (L24-L27) and
# drop (L19-L23) lamps cascade at 200 ms, the same lamp traffic as a Modern ball.
# Stop MPF and Godot first, then run: /Users/adrian/mpf/bin/mpf -c diagnostic_lamp_load.yaml -b -t
config:
  - diagnostic_switches.yaml
  - config_lights.yaml

shows:
  lamp_load_flash:
    - duration: 250ms
      lights: {l_xxx_43: on, l_xxx_44: on, l_xxx_45: on, l_xxx_46: on, l_xxx_47: on}
    - duration: 250ms
      lights: {l_xxx_43: off, l_xxx_44: off, l_xxx_45: off, l_xxx_46: off, l_xxx_47: off}
  lamp_load_craters:
    - duration: 200ms
      lights: {l_xxx_27: on, l_xxx_26: off, l_xxx_25: off, l_xxx_24: off}
    - duration: 200ms
      lights: {l_xxx_27: off, l_xxx_26: on, l_xxx_25: off, l_xxx_24: off}
    - duration: 200ms
      lights: {l_xxx_27: off, l_xxx_26: off, l_xxx_25: on, l_xxx_24: off}
    - duration: 200ms
      lights: {l_xxx_27: off, l_xxx_26: off, l_xxx_25: off, l_xxx_24: on}
  lamp_load_drops:
    - duration: 200ms
      lights: {l_xxx_19: on, l_xxx_20: off, l_xxx_21: off, l_xxx_22: off, l_xxx_23: off}
    - duration: 200ms
      lights: {l_xxx_19: off, l_xxx_20: on, l_xxx_21: off, l_xxx_22: off, l_xxx_23: off}
    - duration: 200ms
      lights: {l_xxx_19: off, l_xxx_20: off, l_xxx_21: on, l_xxx_22: off, l_xxx_23: off}
    - duration: 200ms
      lights: {l_xxx_19: off, l_xxx_20: off, l_xxx_21: off, l_xxx_22: on, l_xxx_23: off}
    - duration: 200ms
      lights: {l_xxx_19: off, l_xxx_20: off, l_xxx_21: off, l_xxx_22: off, l_xxx_23: on}

show_player:
  init_done:
    lamp_load_flash: play
    lamp_load_craters: play
    lamp_load_drops: play
