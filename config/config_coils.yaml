#config_version=6

# L0 is a continuous-duty relay driven by the lamp output, not a pulse coil.
# Re-enable at the next ball after a tilt; retain it between ordinary balls.
digital_outputs:
  game_over_relay:
    number: 0
    type: light
    enable_events: game_started, ball_started
    disable_events: tilt, slam_tilt, game_will_end

  classic_return_gate:
    number: 14
    type: light
    enable_events: classic_open_gate
    disable_events: classic_close_gate, ball_will_end, tilt, slam_tilt, game_will_end

coils:
  c_classic_ball_saver:
    number: 113
    default_pulse_ms: 10
  c_subway_lock:
    number: 1
    default_hold_power: .1
    default_pulse_ms: 300
  c_top_drops:
    number: 2
    default_hold_power: .1
    default_pulse_ms: 300
  # c_CCC:
  #   number: 3
  # c_DDD:
  #   number: 4
  c_subway_kicker:
    number: 5
    default_pulse_ms: 40
  c_right_drops:
    number: 6
    default_hold_power: .1
    default_pulse_ms: 100
  c_GGG:
    number: 7
  c_Replay_Knock:
    number: 8
    default_pulse_ms: 50
  c_outhole:
    number: 9
    default_pulse_ms: 65 
  c_trough_release:
    number: 115 # uses light bank
    default_hold_power: 0.075
    default_pulse_ms: 270
  c_side_kicker_left:
    number: 108 # uses light bank
    default_pulse_ms: 15
  c_hole_kicker_top:
    number: 116 # uses light bank
    default_pulse_ms: 55
  c_skill_motor:
    number: 112 # uses light bank
    default_pulse_ms: 5000
