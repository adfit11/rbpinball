#config_version=6

ball_devices:
  bd_outhole:
    ball_switches: s_trough_3_20
    eject_coil: c_outhole
    eject_targets: bd_trough
    eject_timeouts: 4s
    tags: drain

  bd_trough:
    # Switch 40 is momentary for the first two balls and stays closed at three.
    counter:
      class: custom_code.volcano_trough.VolcanoTroughCounter
      entrance_switch: s_trough_1_40
      entrance_switch_ignore_window_ms: 200ms
      entrance_switch_full_timeout: 500ms
      ball_capacity: 3
    eject_coil: c_trough_release
    # The mechanical plunger has no switch; its lane is part of the playfield.
    eject_targets: playfield
    tags: trough, home

  bd_classic_saucer:
    ball_switches: s_hole_kicker_top_23
    eject_coil: c_hole_kicker_top
    eject_targets: playfield

  bd_classic_firepit:
    ball_switches: s_side_kicker_left_43
    eject_coil: c_side_kicker_left
    eject_targets: playfield

  bd_classic_subway_lock:
    counter:
      class: custom_code.volcano_subway_counter.VolcanoSubwayCounter
      entrance_switch: s_subway_lock_10
      # A ball can retrigger switch 10 over half a second after its first hit.
      entrance_switch_ignore_window_ms: 1000
      ball_capacity: 3
    ejector:
      class: custom_code.subway_ejector.InterlockedSubwayEjector
    eject_coil: c_subway_lock
    eject_targets: bd_classic_subway_kicker
    eject_timeouts: 2s
    eject_all_events: tilt{machine.session_game == "classic"}, game_will_end{machine.session_game == "classic"}

  bd_classic_subway_kicker:
    ball_switches: s_subway_kicker_0
    ejector:
      class: custom_code.subway_kicker_ejector.GuardedSubwayKicker
    eject_coil: c_subway_kicker
    eject_targets: playfield
    eject_timeouts: 2s
