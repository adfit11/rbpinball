#config_version=6

## MPF Main Machine Config File
#
# This file defines your system-wide properties like switches,
# drivers, ball devices, hardware platforms, and more. You can
# include everything here, or create sub-config files to be
# imported and merged with this one.

config:
  - config_ball_devices.yaml
  - config_coils.yaml
  - config_switches.yaml
  - config_lights.yaml
  - config_drop_targets.yaml

custom_code:
  - custom_code.log_retention.LogRetention
  - custom_code.sim_monitor_colors.SimMonitorColors

modes:
  - attract
  - attract_lights
  - classic
  - classic_bonus
  - classic_display
  - classic_targets
  - classic_skill_shot
  - classic_holes
  - classic_gate
  - classic_subway
  - classic_high_score
  - modern
  - modern_targets
  - modern_skill_shot
  - modern_nickels
  - modern_jukebox
  - modern_songs
  - modern_rent_party
  - modern_subway
  - modern_holes
  - modern_ball_saver
  - modern_bonus
  - modern_callouts
  - modern_display
  - modern_high_score
  - tilt

# Each game keeps its own high-score board.
mpf:
  paths:
    classic_high_score: data/classic_high_scores.yaml
    modern_high_score: data/modern_high_scores.yaml

game:
  balls_per_game: 3
  max_players: machine.session_players if machine.session_players > 0 else 1
  add_player_switch_tag: ''

playfields:
  playfield:
    default_source_device: bd_trough
    tags: default

machine:
  balls_installed: 3

virtual_platform_start_active_switches:
  - s_trough_1_40
  - s_trough_2_30

#hardware:
#  platform: lisy
#lisy:
#  connection: network
#  network_port: 5963
#  network_host: lisy 

hardware:
  platform: lisy, virtual

lisy:
  connection: serial
  port: /dev/cu.usbmodem1101
  baud: 115200

# Modern game over: machine level, after high-score entry, so it outlives the modern_display mode.
slide_player:
  game_ended{machine.session_game == "modern"}:
    modern_game_over:
      action: play
      expire: 5s
      priority: 1000
